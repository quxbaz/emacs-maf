<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>maf — Changes</title>
<link rel="stylesheet" href="style.css">
<script src="data/bindings.js"></script>
<script src="data/commits.js"></script>
</head>
<body data-mode="changes">
<nav class="nav" id="nav"></nav>
<main class="wrap">
  <h1>Changes</h1>
  <p class="lede">The whole history of maf, one commit at a time, with the note-keeping commits and merges left out. Group by month, filter by kind, and open a commit's <i>Why</i> for the reasoning recorded with it.</p>
  <div class="stats" id="stats"></div>
  <div class="bars" id="bars"></div>
  <div class="toolbar">
    <input type="search" id="q" placeholder="Filter by words, a command name, a module, a date, or an area…" autocomplete="off">
    <span id="types" class="legend" style="margin:0"></span>
    <span class="muted" id="count"></span>
  </div>
  <div id="list"></div>
  <footer id="foot"></footer>
</main>
<script src="site.js"></script>
<script src="history.js"></script>
</body>
</html>
