<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>maf — Commit history</title>
<link rel="stylesheet" href="style.css">
<script src="data/bindings.js"></script>
<script src="data/commits.js"></script>

<body data-mode="changes">
<nav class="nav" id="nav"></nav>
<main class="wrap full" data-toc>
  <h1>Commit history</h1>
  <p class="lede">The development history behind maf. <a href="changes.html">Back to the feature summary →</a></p>
  <p class="lede">Every commit of maf up to <span id="cutoff"></span>, one at a time, with the note-keeping commits and merges left out. Grouped by subject, filter by kind, and open a commit's <i>Why</i> for the reasoning recorded with it.</p>
  <div class="stats" id="stats"></div>
  <div class="toolbar">
    <input type="search" aria-label="Filter results" id="q" placeholder="Filter by words, a command name, a module, a date, or an area…" autocomplete="off">
    <span id="types" class="legend" style="margin:0"></span>
    <span class="muted" id="count"></span>
  </div>
  <div id="list"></div>
  <footer id="foot"></footer>
</main>
