# tmux in a box.
#
# C-t as the prefix, not C-b: a box is often reached from a terminal
# already running tmux, and the outer session takes C-b first. C-t C-t
# sends a literal C-t on to whatever is in the pane — Emacs reads it as
# transpose-chars.

set -g prefix C-t
unbind C-b
bind C-t send-prefix
